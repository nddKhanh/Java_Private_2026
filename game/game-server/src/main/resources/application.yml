server:
  address: ${GAME_SERVER_ADDRESS:0.0.0.0}
  port: ${GAME_SERVER_PORT:8080}

spring:
  config:
    import: classpath:game-rules.yml
  datasource:
    url: ${GAME_DB_URL:jdbc:h2:file:./data/ant-colony-wars}
    username: ${GAME_DB_USERNAME:sa}
    password: ${GAME_DB_PASSWORD:}
  flyway:
    enabled: true

game:
  security:
    session-hours: 24
  lobby:
    max-accounts-per-team: 5
  profile:
    setup-id: mvp-default
    match-id: match-default
    match-ids:
      - match-default
      - match-training
    board:
      width: 50
      height: 50
    teams:
      - id: BLUE
        display-name: Blue
        color: "#2563eb"
        token: blue-token
        faction-id: ALLIANCE
      - id: CYAN
        display-name: Cyan
        color: "#06b6d4"
        token: cyan-token
        faction-id: ALLIANCE
      - id: GREEN
        display-name: Green
        color: "#16a34a"
        token: green-token
        faction-id: ALLIANCE
      - id: TEAL
        display-name: Teal
        color: "#0d9488"
        token: teal-token
        faction-id: ALLIANCE
      - id: NAVY
        display-name: Navy
        color: "#1e3a8a"
        token: navy-token
        faction-id: ALLIANCE
      - id: RED
        display-name: Red
        color: "#dc2626"
        token: red-token
        faction-id: SWARM
      - id: ORANGE
        display-name: Orange
        color: "#ea580c"
        token: orange-token
        faction-id: SWARM
      - id: YELLOW
        display-name: Yellow
        color: "#ca8a04"
        token: yellow-token
        faction-id: SWARM
      - id: MAGENTA
        display-name: Magenta
        color: "#c026d3"
        token: magenta-token
        faction-id: SWARM
      - id: MAROON
        display-name: Maroon
        color: "#7f1d1d"
        token: maroon-token
        faction-id: SWARM
    units: []
    # Empty list: headquarters are placed on the map corners and edges.
    headquarters: []
    resources: []
    buildings: []
    limits:
      # Simulation tick: every bot runs at most one queued command per tick.
      tick-millis: 250
    # Placed around every headquarters; offsets point inward on the far half of each axis.
    # Units take a random free cell next to their headquarters.
    starter-pack:
      units:
        - type: WORKER
      resources:
        - type: WOOD
          dx: 2
          dy: 2
          amount: 50
        - type: MEAT
          dx: 0
          dy: 2
          amount: 50
      buildings: []
