server:
  address: ${GAME_SERVER_ADDRESS:0.0.0.0}
  port: ${GAME_SERVER_PORT:8080}

spring:
  datasource:
    url: ${GAME_DB_URL:jdbc:h2:file:./data/ant-colony-wars}
    username: ${GAME_DB_USERNAME:sa}
    password: ${GAME_DB_PASSWORD:}
  flyway:
    enabled: true

game:
  security:
    session-hours: 24
  lobby:
    max-accounts-per-team: 5
  profile:
    setup-id: mvp-default
    match-id: match-default
    match-ids:
      - match-default
      - match-training
    board:
      width: 24
      height: 16
    rules:
      version: r6-1
      attack-damage: 1
      attack-range: 1
      max-units-per-team: 50
      spawned-unit-hp: 3
      starting-resources: 0
      harvest-amount: 3
      harvest-range: 0
      barracks-cost: 3
      tower-cost: 2
      wall-cost: 1
      building-hp: 5
    teams:
      - id: BLUE
        display-name: Blue
        color: "#2563eb"
        token: blue-token
        faction-id: ALLIANCE
