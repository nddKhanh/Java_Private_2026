server:
  address: ${GAME_SERVER_ADDRESS:0.0.0.0}
  port: ${GAME_SERVER_PORT:8080}

spring:
  datasource:
    url: ${GAME_DB_URL:jdbc:h2:file:./data/ant-colony-wars}
    username: ${GAME_DB_USERNAME:sa}
    password: ${GAME_DB_PASSWORD:}
  flyway:
    enabled: true

game:
  security:
    session-hours: 24
  lobby:
    max-accounts-per-team: 5
  profile:
    setup-id: mvp-default
    match-id: match-default
    match-ids:
      - match-default
      - match-training
    board:
      width: 50
      height: 50
    rules:
      version: r7-1
      attack-damage: 1
      attack-range: 1
      max-units-per-team: 50
      spawned-unit-hp: 3
      starting-wood: 100
      starting-meat: 100
      harvest-amount: 3
      harvest-range: 0
      barracks-cost: 3
      tower-cost: 2
      wall-cost: 1
      building-hp: 5
      worker-cost: 1
      melee-cost: 2
      ranged-cost: 3
      siege-meat-cost: 3
      siege-wood-cost: 3
    teams:
      - id: BLUE
        display-name: Blue
        color: "#2563eb"
        token: blue-token
        faction-id: ALLIANCE
      - id: CYAN
        display-name: Cyan
        color: "#06b6d4"
        token: cyan-token
        faction-id: ALLIANCE
      - id: GREEN
        display-name: Green
        color: "#16a34a"
        token: green-token
        faction-id: ALLIANCE
      - id: TEAL
        display-name: Teal
        color: "#0d9488"
        token: teal-token
        faction-id: ALLIANCE
      - id: NAVY
        display-name: Navy
        color: "#1e3a8a"
        token: navy-token
        faction-id: ALLIANCE
      - id: RED
        display-name: Red
        color: "#dc2626"
        token: red-token
        faction-id: SWARM
      - id: ORANGE
        display-name: Orange
        color: "#ea580c"
        token: orange-token
        faction-id: SWARM
      - id: YELLOW
        display-name: Yellow
        color: "#ca8a04"
        token: yellow-token
        faction-id: SWARM
      - id: MAGENTA
        display-name: Magenta
        color: "#c026d3"
        token: magenta-token
        faction-id: SWARM
      - id: MAROON
        display-name: Maroon
        color: "#7f1d1d"
        token: maroon-token
        faction-id: SWARM
    units: []
    headquarters:
      - id: hq-blue
        team-id: BLUE
        x: 0
        y: 0
        hp: 3
      - id: hq-red
        team-id: RED
        x: 49
        y: 49
        hp: 3
      - id: hq-cyan
        team-id: CYAN
        x: 0
        y: 12
        hp: 3
      - id: hq-green
        team-id: GREEN
        x: 0
        y: 24
        hp: 3
      - id: hq-teal
        team-id: TEAL
        x: 0
        y: 36
        hp: 3
      - id: hq-navy
        team-id: NAVY
        x: 0
        y: 49
        hp: 3
      - id: hq-orange
        team-id: ORANGE
        x: 49
        y: 0
        hp: 3
      - id: hq-yellow
        team-id: YELLOW
        x: 49
        y: 12
        hp: 3
      - id: hq-magenta
        team-id: MAGENTA
        x: 49
        y: 24
        hp: 3
      - id: hq-maroon
        team-id: MAROON
        x: 49
        y: 36
        hp: 3
    resources: []
    buildings: []
    limits:
      max-actions-per-bot-per-batch: 10
      command-queue-capacity: 32
      tick-millis: 250
    # Placed around every headquarters; offsets point inward on the far half of each axis.
    starter-pack:
      units:
        - type: WORKER
          dx: 1
          dy: 0
      resources:
        - type: WOOD
          dx: 2
          dy: 2
          amount: 50
        - type: MEAT
          dx: 0
          dy: 2
          amount: 50
      buildings: []
